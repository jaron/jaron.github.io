<!doctype html>
<!-- The card a shared link to the home page shows (public/og-image.png, 1200 x 630), drawn as the page is: the ink
     ground, the portrait melting into it on the right, the name with its glow, the warm line, the facts in mono, as
     said on a phone. No address:
     a link's preview shows it.
     Rendered by scripts/og-image.mjs. -->
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<style>
    @font-face { font-family: 'Archivo'; src: url('../public/fonts/Archivo-w1000-500.ttf'); font-weight: 500; }
    @font-face { font-family: 'Archivo'; src: url('../public/fonts/Archivo-w1000-700.ttf'); font-weight: 700; }
    @font-face { font-family: 'Plex Mono'; src: url('../public/fonts/src/IBMPlexMono-Regular.ttf'); font-weight: 400; }

    :root {
        --ink: #050507;
        --bone: #eee9df;
        --ash: #b3aea5;
        --graphite: #8a857d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: var(--ink);
        color: var(--bone);
        font-family: 'Archivo', sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    .portrait {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 620px;
        height: 620px;
        object-fit: cover;
        object-position: 60% 30%;
        opacity: 0.9;
        -webkit-mask-image: radial-gradient(closest-side, #000 55%, transparent);
        mask-image: radial-gradient(closest-side, #000 55%, transparent);
    }

    .words {
        position: absolute;
        left: 84px;
        top: 150px;
    }

    .label {
        font: 400 22px/1.4 'Plex Mono', monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ash);
    }

    .name {
        font-weight: 700;
        font-size: 116px;
        line-height: 0.9;
        letter-spacing: -0.035em;
        color: #fffaf0;
        text-shadow:
            0 0 0.02em rgb(255 248 235 / 0.7),
            0 0 0.12em rgb(255 240 220 / 0.35),
            0 0 0.5em rgb(255 235 210 / 0.12);
    }

    .name .label {
        display: block;
        margin: 0 0 18px 0.1em;
        text-shadow: none;
    }

    .doing {
        margin: 0.9em 0 0 0.12em;
        font-weight: 500;
        font-size: 42px;
        line-height: 1.3;
        color: #ffdcbc;
        text-shadow:
            0 0 0.05em rgb(255 190 130 / 1),
            0 0 0.22em rgb(255 122 47 / 1),
            0 0 0.6em rgb(255 122 47 / 0.6),
            0 0 1.4em rgb(255 100 30 / 0.35);
    }

    .foot {
        position: absolute;
        left: 84px;
        right: 84px;
        bottom: 64px;
        white-space: nowrap;
    }

    .facts span { color: var(--bone); }
    .facts i { font-style: normal; color: var(--graphite); margin: 0 0.9em; }
</style>
</head>
<body>
    <img class="portrait" src="../public/imgs/profile.jpg" alt="" />
    <div class="words">
        <h1 class="name"><span class="label">Dr</span>Jaron Collis</h1>
        <p class="doing">I build AI companies</p>
    </div>
    <div class="foot label">
        <p class="facts"><span>AI PhD</span><i>·</i><span>EF alum</span><i>·</i><span>Founder</span></p>
    </div>
</body>
</html>
